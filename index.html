<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live View - CSE Project</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1a1a1a; color: white; padding: 15px; text-align: center; }
        #search-container { margin-bottom: 10px; }
        input { padding: 10px; width: 250px; border-radius: 4px; border: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        
        #map { flex: 1; width: 100%; } /* Map poori screen cover karega */
        
        #live-view-panel { height: 250px; background: #000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 4px solid #007bff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<header>
    <h2>World Explorer: Live Surveillance</h2>
    <div id="search-container">
        <input type="text" id="locationInput" placeholder="Kahin ka bhi naam likho (e.g. Paris)...">
        <button onclick="findLocation()">Live Dekho</button>
    </div>
</header>

<div id="map"></div>

<div id="live-view-panel">
    <div id="videoContainer" style="width: 100%; height: 100%;">
        <p style="text-align: center; margin-top: 100px;">Map par search karein aur live streaming dekhein</p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
